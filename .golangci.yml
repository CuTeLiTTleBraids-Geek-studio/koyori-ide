# N-128: golangci-lint configuration. Excludes generated/vendored dirs
# that should not be linted.

run:
  timeout: 10m

linters:
  # Enable a focused, stable set. Avoid style-only linters (gofmt, goimports)
  # that would produce noisy diffs on existing code — those are better
  # enforced via a formatter in a separate pass.
  enable:
    - errcheck        # unchecked errors
    - gosimple        # simplifications
    - govet           # `go vet` checks
    - ineffassign     # ineffectual assignments
    - staticcheck     # static analysis
    - typecheck       # type issues
    - unused          # unused code
    - misspell        # typos in comments/strings
    - unconvert       # unnecessary type conversions

linters-settings:
  errcheck:
    # Allow common Close/Write ignores in tests without explicit _ =.
    check-type-assertions: false
    check-blank: false
    # P19 CI 修复：清理路径（defer Close/Remove）的失败本就有意忽略
    # （blank 赋值已通过 check-blank 放行），这里把同样的豁免显式化到
    # 函数级，避免对每个 defer 手写 func() { _ = ... } 包装。数据路径
    # （io.Copy、fmt.Sscanf、Read/Write）仍然强制检查。
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close
      - (*os.Root).Close
      - (net.Listener).Close
      - (*gzip.Reader).Close
      - (*syscall.LazyProc).Call
      - os.Remove
      - os.RemoveAll
      - golang.org/x/sys/unix.Close
  staticcheck:
    # Use a reasonable checks set; ST1000 (missing package comment) is
    # noisy for a small project.
    checks: ["all", "-ST1000"]

issues:
  # Don't auto-exclude anything by default — be explicit about what we skip.
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  # P1: migrated from the deprecated run.skip-dirs / run.skip-files (removed
  # in golangci-lint v1.57+). These belong under the issues section now.
  exclude-dirs:
    - frontend/bindings
    - frontend/.bindings-tmp
    - frontend/node_modules
    - build
    - dist
    - tools
  exclude-files:
    - ".*_bind\\.go$"
  exclude-rules:
    # Test files commonly ignore errors on purpose (e.g. _ = w.Write(...)).
    - path: _test\.go
      linters:
        - errcheck
    # P19 CI 修复：defer 形态的清理调用（Close/CloseHandle、syscall
    # LazyProc.Call）是 best-effort 语义，错误本就有意忽略；与上方
    # exclude-functions 的 cleanup-path 豁免保持一致。数据路径（Read/
    # Write/io.Copy）不受影响，仍然强制检查。
    - source: "defer .*\\.[A-Za-z]*(Close|Call)[A-Za-z]*\\("
      linters:
        - errcheck
    # The generated bindings directory is auto-generated by wails3.
    - path: frontend/bindings
      linters:
        - all
