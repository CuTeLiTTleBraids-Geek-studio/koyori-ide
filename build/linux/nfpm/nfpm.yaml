# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "koyori-ide"
arch: ${GOARCH}
platform: "linux"
version: "0.2.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "AI-Powered Coding Desktop App for Professional Developers"
vendor: "Koyori IDE Contributors"
homepage: "https://github.com/CuTeLiTTleBraids-Geek-studio/koyori-ide"
license: "MIT"
release: "1"

contents:
  - src: "./bin/koyori-ide"
    dst: "/usr/local/bin/koyori-ide"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/koyori-ide.png"
  - src: "./build/linux/koyori-ide.desktop"
    dst: "/usr/share/applications/koyori-ide.desktop"

# This checked-in metadata is the GTK4/WebKitGTK 6.0 default used by the
# Wails Taskfile. The release path is build/scripts/build-linux.sh; it writes
# build/linux/nfpm/koyori-ide.yaml with dependencies selected from the actual
# pkg-config result. Do not package a binary built with the gtk3 tag from this
# static default.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
