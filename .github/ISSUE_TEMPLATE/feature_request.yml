name: 功能建议 / Feature request
description: 提出新功能或改进 / Propose a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 场景与问题 / Context & problem
      description: 你想解决什么问题？/ What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
      description: 期望的行为或设计 / Desired behavior or design
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives
      description: 考虑过的其他做法 / Alternatives you considered
  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我已在 Issues 中搜索过类似建议 / I searched existing issues
          required: true