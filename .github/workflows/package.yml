name: Package Desktop Apps

# 运行我们的 build/scripts/build-macos.sh 和 build/scripts/build-linux.sh
# 打包脚本，生成 macOS DMG、Linux AppImage/deb/rpm 安装包。
#
# 触发条件：
#   1. push 到 main/master 分支（打包脚本或构建配置变更时）
#   2. 手动触发（workflow_dispatch）
#   3. pull_request（仅验证脚本能跑通，不上传产物）
#
# 产物：
#   macOS: koyori-ide-<version>-macos-<arch>.dmg / koyori-ide.app
#   Linux: koyori-ide-<version>-linux-<arch>.AppImage / .deb / .rpm

on:
  push:
    branches: [main, master]
    paths:
      # Package whenever application code, embedded frontend assets, version
      # metadata, or build configuration can change the produced desktop
      # artifacts. A narrow build-script-only filter can leave main behind a
      # stale package after an otherwise valid source change lands on main.
      - "VERSION"
      - "go.mod"
      - "go.sum"
      - "*.go"
      - "services/**"
      - "internal/**"
      - "frontend/**"
      - "Taskfile.yml"
      - "scripts/**"
      - "build/**"
      - ".github/workflows/package.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "VERSION"
      - "go.mod"
      - "go.sum"
      - "*.go"
      - "services/**"
      - "internal/**"
      - "frontend/**"
      - "Taskfile.yml"
      - "scripts/**"
      - "build/**"
      - ".github/workflows/package.yml"
  workflow_dispatch:
    inputs:
      skip_dmg:
        description: "跳过 macOS DMG 创建（加快构建）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  metadata:
    name: Verify release metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19"

      - name: Require synchronized stable release metadata
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/read-release-version.sh VERSION
          node scripts/sync-release-metadata.mjs --check

  # ===========================================================================
  # macOS 构建（arm64 + amd64）
  # ===========================================================================
  macos:
    name: macOS (${{ matrix.arch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15          # Apple Silicon
          - arch: amd64
            runner: macos-15-intel    # Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --registry=https://registry.npmjs.org
        working-directory: frontend

      - name: Generate and verify untracked Wails bindings
        run: |
          node scripts/check-bindings-ownership.mjs
          node scripts/generate-bindings.mjs
          node scripts/check-bindings.mjs

      - name: Install pinned create-dmg
        if: ${{ !inputs.skip_dmg }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/create-dmg-v1.3.0.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/create-dmg/create-dmg/archive/refs/tags/v1.3.0.tar.gz \
            --output "$archive"
          echo "c50d2bc97c3d6292642bac55f530d247eaf4bf65ee605f26b4caf339383e381c  $archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/create-dmg-src" "$RUNNER_TEMP/create-dmg-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/create-dmg-src" --strip-components=1
          make -C "$RUNNER_TEMP/create-dmg-src" install prefix="$RUNNER_TEMP/create-dmg-bin"
          echo "$RUNNER_TEMP/create-dmg-bin/bin" >> "$GITHUB_PATH"

      - name: Make build script executable
        run: chmod +x build/scripts/build-macos.sh

      - name: Run macOS build script
        run: |
          ARGS="${{ matrix.arch }}"
          if [ "${{ inputs.skip_dmg }}" = "true" ]; then
            ARGS="$ARGS --no-dmg"
          fi
          ./build/scripts/build-macos.sh $ARGS
        shell: bash

      - name: Verify macOS artifacts
        id: verify
        run: |
          set -euo pipefail
          ls -lh bin/
          version="$(bash scripts/read-release-version.sh VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::VERSION must be a stable X.Y.Z value: $version"
            exit 1
          }
          app_binary=bin/koyori-ide.app/Contents/MacOS/koyori-ide
          test -x "$app_binary"
          test -s bin/koyori-ide
          expected_arch="${{ matrix.arch }}"
          if [ "$expected_arch" = "amd64" ]; then expected_arch="x86_64"; fi
          lipo "$app_binary" -verify_arch "$expected_arch"
          [ "$(lipo -archs "$app_binary")" = "$expected_arch" ] || {
            echo "::error::macOS app must contain exactly the ${expected_arch} slice"
            exit 1
          }
          shopt -s nullglob
          dmgs=(bin/koyori-ide-*.dmg)
          if [ "${{ inputs.skip_dmg }}" = "true" ]; then
            if [ "${#dmgs[@]}" -ne 0 ]; then
              echo "::error::DMG output is forbidden when skip_dmg is true"
              exit 1
            fi
            printf 'dmg_path=\n' >> "$GITHUB_OUTPUT"
          else
            expected_dmg="bin/koyori-ide-${version}-macos-${{ matrix.arch }}.dmg"
            if [ "${#dmgs[@]}" -ne 1 ] || [ "${dmgs[0]}" != "$expected_dmg" ] || [ ! -s "$expected_dmg" ]; then
              echo "::error::Expected exactly one non-empty macOS DMG: $expected_dmg"
              exit 1
            fi
            printf 'dmg_path=%s\n' "$expected_dmg" >> "$GITHUB_OUTPUT"
          fi
          portable_archive="bin/koyori-ide-${version}-macos-${{ matrix.arch }}-portable.tar.gz"
          rm -f "$portable_archive"
          tar -czf "$portable_archive" -C bin koyori-ide.app koyori-ide
          test -s "$portable_archive"
          printf 'portable_path=%s\n' "$portable_archive" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Upload macOS artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ${{ steps.verify.outputs.portable_path }}
            ${{ steps.verify.outputs.dmg_path }}
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # Linux 构建（amd64 + arm64）
  # ===========================================================================
  linux:
    name: Linux (${{ matrix.arch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # G-CI-02: generate-bindings compiles the pinned wails3 CLI from source;
      # on Linux that requires the GUI development headers (same set as
      # ci.yml / release.yml). Missing these made this job fail on ubuntu.
      - name: Install Linux GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libgcc-12-dev libstdc++-12-dev pkg-config

      - name: Install frontend deps
        run: npm ci --registry=https://registry.npmjs.org
        working-directory: frontend

      - name: Generate and verify untracked Wails bindings
        run: |
          node scripts/check-bindings-ownership.mjs
          node scripts/generate-bindings.mjs
          node scripts/check-bindings.mjs

      - name: Make build script executable
        run: chmod +x build/scripts/build-linux.sh

      - name: Run Linux build script
        run: ./build/scripts/build-linux.sh ${{ matrix.arch }}
        shell: bash

      - name: Verify产物
        id: verify
        run: |
          set -euo pipefail
          version="$(bash scripts/read-release-version.sh VERSION)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::VERSION must be a stable X.Y.Z value: $version"
            exit 1
          }
          expected_appimage="bin/koyori-ide-${version}-linux-${{ matrix.arch }}.AppImage"
          expected_deb="bin/koyori-ide-${version}-linux-${{ matrix.arch }}.deb"
          expected_rpm="bin/koyori-ide-${version}-linux-${{ matrix.arch }}.rpm"
          test -s bin/koyori-ide
          for artifact in "$expected_appimage" "$expected_deb" "$expected_rpm"; do
            if [ ! -s "$artifact" ]; then
              echo "::error::Missing required Linux package: $artifact"
              exit 1
            fi
          done
          portable_archive="bin/koyori-ide-${version}-linux-${{ matrix.arch }}-portable.tar.gz"
          rm -f "$portable_archive"
          tar -czf "$portable_archive" -C bin "$(basename "$expected_appimage")" koyori-ide
          test -s "$portable_archive"
          printf 'portable_path=%s\n' "$portable_archive" >> "$GITHUB_OUTPUT"
          printf 'deb_path=%s\n' "$expected_deb" >> "$GITHUB_OUTPUT"
          printf 'rpm_path=%s\n' "$expected_rpm" >> "$GITHUB_OUTPUT"
          echo "=== bin 目录内容 ==="
          ls -lh bin/
          echo ""
          echo "=== AppImage 信息 ==="
          file "$expected_appimage"
          echo ""
          echo "=== deb 包信息 ==="
          dpkg-deb -I "$expected_deb"
          echo "=== rpm 包信息 ==="
          file "$expected_rpm"
        shell: bash

      - name: Upload Linux artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}
          path: |
            ${{ steps.verify.outputs.portable_path }}
            ${{ steps.verify.outputs.deb_path }}
            ${{ steps.verify.outputs.rpm_path }}
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # Windows 构建（amd64）
  # ===========================================================================
  windows:
    name: Windows (${{ matrix.arch }})
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --registry=https://registry.npmjs.org
        working-directory: frontend

      - name: Generate and verify untracked Wails bindings
        shell: bash
        run: |
          node scripts/check-bindings-ownership.mjs
          node scripts/generate-bindings.mjs
          node scripts/check-bindings.mjs

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.8

      - name: Install WiX Toolset v3
        run: choco install wixtoolset --version=3.14.1.20250415 -y --no-progress --allow-downgrade

      - name: Run Windows build script (exe + MSI installer)
        shell: pwsh
        run: |
          ./build/scripts/build-windows.ps1 -Arch ${{ matrix.arch }} -SkipNSIS
          ./build/scripts/build-msi.ps1 -Arch ${{ matrix.arch }}

      - name: Verify产物
        id: verify
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw) -replace '\r?\n$', ''
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw "VERSION must be a stable X.Y.Z value: $version" }
          $expectedMsi = "bin/koyori-ide-v$version-windows-${{ matrix.arch }}.msi"
          $expected = @(
            "bin/koyori-ide.exe",
            $expectedMsi
          )
          foreach ($artifact in $expected) {
            $item = Get-Item -LiteralPath $artifact -ErrorAction Stop
            if ($item.Length -le 0) { throw "Empty Windows artifact: $artifact" }
          }
          $msis = @(Get-ChildItem -LiteralPath bin -Filter "koyori-ide-v*-windows-*.msi" -File)
          if ($msis.Count -ne 1 -or $msis[0].Name -cne [IO.Path]::GetFileName($expectedMsi)) {
            throw "Expected exactly one Windows MSI named $([IO.Path]::GetFileName($expectedMsi)); found $($msis.Name -join ', ')"
          }
          "exe_path=bin/koyori-ide.exe" >> $env:GITHUB_OUTPUT
          "msi_path=$expectedMsi" >> $env:GITHUB_OUTPUT
          echo "=== bin 目录内容 ==="
          Get-ChildItem bin/koyori-ide* | ForEach-Object {
            $sizeMb = [math]::Round($_.Length / 1MB, 1)
            Write-Host ("  {0}  ({1} MB)" -f $_.Name, $sizeMb)
          }

      - name: Upload Windows artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}
          path: |
            ${{ steps.verify.outputs.exe_path }}
            ${{ steps.verify.outputs.msi_path }}
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # 汇总产物（仅非 PR 时运行）
  # ===========================================================================
  summary:
    name: Build Summary
    needs: [windows, macos, linux]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: List all artifacts
        run: |
          echo "============================================"
          echo "  所有构建产物"
          echo "============================================"
          find artifacts -type f | sort | while read f; do
            size=$(du -h "$f" | cut -f1)
            echo "  $size  $f"
          done
          echo ""
          echo "============================================"
          echo "  产物总大小"
          echo "============================================"
          du -sh artifacts/
